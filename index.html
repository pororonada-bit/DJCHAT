<style>
:root{
  /* 기본 테마: 차분한 회색 바탕 + 부드러운 파랑 */
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#1F2329;--muted:#6B7380;--line:#E3E6EB;
  --accent:#4A6FA5;--accent-ink:#FFFFFF;--mine:#DCE6F4;--mine-ink:#1F2329;--theirs:#FFFFFF;
  --warn:#C0392B;--chip:#E9EEF6;--dot:#E5484D;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#15181D;--surface:#1D2128;--ink:#E5E8EC;--muted:#959DA9;--line:#2C323B;
    --accent:#8DAEDD;--accent-ink:#111722;--mine:#2D4262;--mine-ink:#EAF0F8;--theirs:#262B33;
    --warn:#F08A80;--chip:#252E3B;--dot:#FF6B6F;color-scheme:dark;
  }
}
/* 핑크 테마 (예전 기본 색) */
:root[data-theme="pink"]{
  --bg:#F3F1F6;--surface:#FFFFFF;--ink:#221C2B;--muted:#6F6680;--line:#E0DBE7;
  --accent:#C73E73;--accent-ink:#FFFFFF;--mine:#C73E73;--mine-ink:#FFFFFF;--theirs:#FFFFFF;
  --warn:#B4322C;--chip:#F6E3EC;--dot:#E5484D;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="pink"]{
    --bg:#16131B;--surface:#201C27;--ink:#EEEAF3;--muted:#9C93AB;--line:#322C3B;
    --accent:#F07AA6;--accent-ink:#22121A;--mine:#B8406E;--mine-ink:#FFFFFF;--theirs:#2B2533;
    --warn:#F07A70;--chip:#3A2431;--dot:#FF6B6F;color-scheme:dark;
  }
}
/* 화이트 / 블랙 테마 */
:root[data-theme="white"]{
  --bg:#F4F4F5;--surface:#FFFFFF;--ink:#111113;--muted:#6B6B73;--line:#E4E4E7;
  --accent:#111113;--accent-ink:#FFFFFF;--mine:#111113;--mine-ink:#FFFFFF;--theirs:#FFFFFF;
  --warn:#C62828;--chip:#ECECEE;--dot:#E5484D;color-scheme:light;
}
:root[data-theme="black"]{
  --bg:#000000;--surface:#111111;--ink:#F2F2F2;--muted:#9A9A9A;--line:#262626;
  --accent:#FFFFFF;--accent-ink:#000000;--mine:#FFFFFF;--mine-ink:#000000;--theirs:#1F1F1F;
  --warn:#FF6B6B;--chip:#222222;--dot:#FF4D4F;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-weight:700;font-size:22px;margin:0;color:var(--ink);letter-spacing:-.04em;display:flex;align-items:flex-start;gap:2px;white-space:nowrap}
nav{display:flex;gap:2px;margin-left:auto}
nav button{position:relative;border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500}
nav button[aria-current="true"]{background:var(--chip);color:var(--accent)}
.badge{position:absolute;top:0;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--dot);color:#fff;font-size:11px;line-height:16px;text-align:center;font-weight:700}
.sound{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px}

main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:500}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.empty{color:var(--muted);padding:28px 4px;text-align:center;list-style:none}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--muted);padding:0;font-size:14px}
.link:hover{color:var(--ink)}
input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}

/* 시작 화면 */
.welcome{max-width:420px;margin:8vh auto 0;text-align:center}
.welcome .logo{font-size:44px;margin-bottom:6px;justify-content:center}
.welcome p{color:var(--muted);margin:0 0 24px}
.welcome .stack{display:flex;flex-direction:column;gap:10px;text-align:left}

.tabs{display:flex;gap:4px;margin-bottom:6px}.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);padding:8px;border-radius:8px;color:var(--muted)}.tabs button[aria-pressed="true"]{background:var(--chip);color:var(--accent);border-color:var(--accent)}
input[type=email],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
input[type=email]:focus,input[type=password]:focus{border-color:var(--accent)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:16px}
.imgs a{display:block;border-radius:10px;overflow:hidden;background:var(--chip)}
.imgs img{display:block;width:100%;height:auto;max-height:520px;object-fit:cover}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.attach{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-size:18px;flex:none}
.bubble.photo{padding:3px;background:none}
.me .bubble.photo{background:none}
.bubble a{display:block}
.bubble img{display:block;max-width:min(240px,60vw);max-height:320px;border-radius:12px;object-fit:cover;background:var(--chip)}
.bubble .cap{padding:5px 9px 3px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-top:10px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.pub{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 7px}
.publist{list-style:none;margin:0;padding:0}
.publist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.publist li:last-child{border-bottom:0}
.publist .fn{flex:1}
.bubble{cursor:pointer;-webkit-touch-callout:none}
.bubble.sel{outline:2px solid var(--accent);outline-offset:2px}
.bubble.sticker{background:none;padding:0}
.me .bubble.sticker{background:none}
.bubble.sticker img{width:120px;height:120px;max-width:none;max-height:none;object-fit:contain;background:none;border-radius:0}
.acts{display:flex;gap:6px;margin:3px 0 8px;flex-wrap:wrap}
.acts.me{align-self:flex-end}
.acts button{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.acts button.danger{color:var(--warn)}
.emo-panel{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;max-height:250px;overflow-y:auto}
.emo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px;color:var(--muted)}
.emo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.emo{position:relative;border:0;background:var(--chip);border-radius:12px;aspect-ratio:1/1;padding:6px;display:grid;place-items:center}
.emo img{width:100%;height:100%;object-fit:contain;display:block}
.emo.add{font-size:26px;color:var(--accent);border:2px dashed var(--accent);background:none}
.emo .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:13px;line-height:22px;padding:0}
.emo-new{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.emo-new img{width:64px;height:64px;object-fit:contain;background:var(--chip);border-radius:10px}
.emo-new input{flex:1;min-width:120px}
.admin-tag{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 7px;margin-left:6px}
.banned-tag{font-size:11px;font-weight:700;color:#fff;background:var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px}
.ulist{list-style:none;margin:0;padding:0}
.ulist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ulist li:last-child{border-bottom:0}
.ulist .fn{flex:1;min-width:140px}
.ulist .sub{font-size:12px;color:var(--muted);display:block;font-weight:400}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.theme-opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.theme-opt[aria-pressed="true"]{border-color:var(--accent)}
.swatch{width:100%;height:46px;border-radius:8px;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;gap:4px;border:1px solid rgba(128,128,128,.25)}
.swatch i{display:block;width:26px;height:12px;border-radius:6px}
.mute{border:0;background:none;font-size:18px;padding:2px 4px}
.rmute{font-size:12px;margin-left:4px;opacity:.7}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
@media (max-width:560px){.logo{font-size:19px}nav{gap:0}nav button{padding:6px 8px;font-size:15px}}
@media (max-width:400px){.logo{display:none}nav{margin-left:0}}
#refresh{font-size:20px;line-height:1}
#refresh.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;justify-content:center;pointer-events:none;z-index:4;opacity:0;transition:opacity .15s}
.ptr span{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--accent);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.ptr.ready span{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){#refresh.spin{animation:none}}
.sorts{display:flex;gap:6px;margin:0 0 10px}
.sorts button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:14px}
.sorts button[aria-pressed="true"]{background:var(--chip);color:var(--accent);border-color:var(--accent);font-weight:500}
.cnt{color:var(--accent);font-weight:500}
.c-sticker{width:100px;height:100px;object-fit:contain;display:block;margin-top:4px}
.c-tools{display:flex;gap:8px;align-items:flex-start}
.c-tools textarea{flex:1}
.c-emo{margin-top:8px;border:1px solid var(--line);border-radius:12px}
.crown{margin-right:3px}
.notice{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;background:var(--chip);border-bottom:1px solid var(--line);font-size:14px}
.notice .nt{flex:1;white-space:pre-wrap;word-break:break-word;max-height:4.8em;overflow:hidden}
.notice.open .nt{max-height:none}
.notice .nb{font-weight:700;color:var(--accent);flex:none}
.members{border-bottom:1px solid var(--line);background:var(--surface);padding:10px 12px;max-height:55%;overflow-y:auto}
.members h3{font-size:14px;color:var(--muted);font-weight:500;margin:10px 0 6px}
.members h3:first-child{margin-top:0}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mlist li:last-child{border-bottom:0}
.mlist .fn{flex:1;min-width:120px}
.mlist .btn{padding:5px 10px;font-size:13px}
.mgr textarea{width:100%;min-height:70px;resize:vertical;margin-bottom:8px}
.guide-back{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.guide{width:min(440px,100%);max-height:100%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:26px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .2s ease-out}
.guide .g-emoji{font-size:44px;line-height:1;margin-bottom:12px}
.guide h2{font-size:21px;color:var(--ink);margin:0 0 10px;font-weight:700}
.guide ul{margin:0;padding-left:20px;line-height:1.7}
.guide li{margin-bottom:4px}
.guide .g-note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:10px;padding:8px 10px;margin-top:12px}
.g-dots{display:flex;justify-content:center;gap:6px;margin:18px 0 14px}
.g-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.g-dots i.on{background:var(--accent);width:18px;border-radius:4px}
.g-btns{display:flex;gap:8px;justify-content:space-between;align-items:center}
@media (prefers-reduced-motion:reduce){.guide{animation:none}}
/* 게시판 */
.posts{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:12px;border:1px solid var(--line);overflow:hidden}
.posts li+li{border-top:1px solid var(--line)}
.post-row{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:12px 16px;gap:2px}
.post-row:hover{background:var(--chip)}
.pt{font-weight:500;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.pm{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.write{display:flex;flex-direction:column;gap:10px}
.write textarea{min-height:240px;resize:vertical}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.post h1{font-size:22px;word-break:break-word}
.post .pm{margin:4px 0 16px}
.post .body{white-space:pre-wrap;word-break:break-word;line-height:1.75}
.post-actions{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.like[aria-pressed="true"]{background:var(--chip);color:var(--accent);border-color:var(--accent)}
.comments{margin-top:18px}
.comments ul{list-style:none;margin:0 0 12px;padding:0}
.comments li{padding:10px 2px;border-bottom:1px solid var(--line)}
.c-meta{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.c-text{white-space:pre-wrap;word-break:break-word}

/* 채팅 */
.rooms{list-style:none;margin:16px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rooms li+li{border-top:1px solid var(--line)}
.room-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:none;padding:12px 16px}
.room-row:hover{background:var(--chip)}
.rn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{font-size:12px;color:var(--muted);text-align:right}
.rp{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdot{justify-self:end;align-self:center;width:8px;height:8px;border-radius:50%;background:var(--dot)}
.room{display:flex;flex-direction:column;height:calc(100dvh - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.room-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.room-head .rn{font-size:17px;font-weight:700;flex:1;min-width:0}
.code{font-weight:700;letter-spacing:.12em;background:var(--chip);color:var(--accent);border:0;border-radius:6px;padding:3px 8px;font-size:14px}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;background:var(--bg);display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 10px;margin:10px 0}
.who{font-size:13px;color:var(--muted);margin:8px 0 2px 2px}
.line{display:flex;align-items:flex-end;gap:6px;max-width:82%}
.line.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:7px 12px;border-radius:16px;background:var(--theirs);white-space:pre-wrap;word-break:break-word;border-top-left-radius:6px}
.me .bubble{background:var(--mine);color:var(--mine-ink);border-top-left-radius:16px;border-top-right-radius:6px}
.tm{font-size:11px;color:var(--muted);white-space:nowrap}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{resize:none;max-height:120px;min-height:42px}

/* 친구 */
.mycode{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mycode .code{font-size:20px;padding:4px 12px}
.friends{list-style:none;margin:0;padding:0}
.friends li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.friends li:last-child{border-bottom:0}

function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class")el.className=v;
    else if(k==="text")el.textContent=v;
    else if(k.startsWith("on")&&typeof v==="function")el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,"");
    else if(v!==false&&v!=null)el.setAttribute(k,String(v));
  }
  for(const c of kids.flat()){
    if(c==null||c===false)continue;
    el.append(c instanceof Node?c:document.createTextNode(String(c)));
  }
  return el;
}

function pickFiles(multiple){return new Promise(res=>{const i=h("input",{type:"file",accept:"image/*",multiple:!!multiple,style:"display:none"});i.addEventListener("change",()=>{res([...i.files]);i.remove();});document.body.append(i);i.click();});}
async function shrink(file){
  if(file.type==="image/gif"&&file.size<5e6)return file;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
    const max=1600;const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*sc)),hh=Math.max(1,Math.round(img.naturalHeight*sc));
    const c=document.createElement("canvas");c.width=w;c.height=hh;c.getContext("2d").drawImage(img,0,0,w,hh);
    return await new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",0.85));
  }finally{URL.revokeObjectURL(url);}
}
async function uploadPhoto(file){
  if(!file.type.startsWith("image/"))throw new Error("NOT_IMAGE");
  const blob=await shrink(file);
  if(!blob)throw new Error("NOT_IMAGE");
  if(blob.size>5*1024*1024)throw new Error("TOO_BIG");
  const ext=blob.type==="image/gif"?"gif":"jpg";
  const path=S.uid+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  must(await sb.storage.from("photos").upload(path,blob,{contentType:blob.type||"image/jpeg",cacheControl:"31536000"}));
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}

function pendingRequests(){const d=dismissed();return S.incoming.filter(id=>!S.friends.includes(id)&&!d.includes(id));}
function isMuted(c){return !!(S.mutes&&S.mutes.has(c));}
async function loadMutes(){
  try{const rows=must(await sb.from("room_mutes").select("room_id"));S.mutes=new Set(rows.map(r=>r.room_id));S.muteReady=true;}
  catch(e){console.warn(e);S.mutes=S.mutes||new Set();S.muteReady=false;}
  updateRoomList();updateRoomHead();updateBadges();
}
async function setMute(c,on){
  try{
    if(on)must(await sb.from("room_mutes").insert({room_id:c}));
    else must(await sb.from("room_mutes").delete().eq("room_id",c).eq("user_id",S.uid));
    if(on)S.mutes.add(c);else S.mutes.delete(c);
    toast(on?"이 방 알림을 껐어요":"이 방 알림을 켰어요");
  }catch(e){
    if(/room_mutes/.test((e&&e.message)||""))toast("방 알림 설정이 필요해요. add-room-mute.sql을 실행해 주세요.");else handleErr(e);
  }
  updateRoomList();updateRoomHead();updateBadges();
}
function updateBadges(){
  const unread=Object.keys(S.rooms).filter(c=>isUnread(c)&&!isMuted(c)).length;
  document.title=(unread?"("+unread+") ":"")+"다정챗";
  for(const b of document.querySelectorAll("#nav button")){
    const old=b.querySelector(".badge");if(old)old.remove();
    const n=b.dataset.tab==="chat"?unread:b.dataset.tab==="friends"?pendingRequests().length:0;
    if(n)b.append(h("span",{class:"badge"},n>99?"99+":n));
  }
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.view.name==="room"){markRead(S.view.code);updateBadges();updateRoomList();}});
// 앱을 다시 열거나 인터넷이 다시 연결되면 목록을 새로 받아오기 (홈 화면 앱은 백그라운드에서 연결이 끊기기 쉬워요)
const resync=debounce(()=>{if(!S.started)return;loadRooms();loadPosts();loadFriends();loadMutes();},400);

/* 새로고침: 지금 보고 있는 화면과 목록을 다시 받아오고 실시간 연결도 새로 맺어요 */
let refreshing=false;
async function refreshAll(){
  if(!S.started||refreshing)return;
  refreshing=true;const rb=$("#refresh");rb.classList.add("spin");
  try{
    subscribeGlobal();
    await Promise.all([loadRooms(),loadPosts(),loadFriends(),loadMutes()]);
    if(S.view.name!=="write")go(S.tab,S.view);
    toast("새로고침했어요");
  }catch(e){handleErr(e);}
  setTimeout(()=>{rb.classList.remove("spin");refreshing=false;},400);
}
$("#refresh").addEventListener("click",refreshAll);

/* 화면 맨 위에서 아래로 끌어내리면 새로고침 (채팅 말풍선 영역 제외) */
(()=>{
  const ptr=$("#ptr");let y0=null,dy=0;
  window.addEventListener("touchstart",e=>{
    if(!S.started||window.scrollY>0||e.touches.length!==1||e.target.closest(".msgs,.emo-panel,textarea,input")){y0=null;return;}
    y0=e.touches[0].clientY;dy=0;
  },{passive:true});
  window.addEventListener("touchmove",e=>{
    if(y0==null)return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||window.scrollY>0){ptr.style.opacity="0";return;}
    const d=Math.min(dy,120);
    ptr.style.opacity=String(Math.min(1,d/70));
    ptr.style.transform="translateY("+(d/2)+"px)";
    ptr.classList.toggle("ready",dy>80);
  },{passive:true});
  window.addEventListener("touchend",()=>{
    if(y0!=null&&dy>80&&window.scrollY<=0)refreshAll();
    y0=null;dy=0;ptr.style.opacity="0";ptr.style.transform="";ptr.classList.remove("ready");
  });
})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)resync();});
window.addEventListener("online",resync);
window.addEventListener("pageshow",e=>{if(e.persisted)resync();});

/* ---------- 화면 전환 ---------- */
const TABS=[["board","게시판"],["chat","채팅"],["friends","친구"],["settings","설정"]];
function renderNav(show){
  const nav=$("#nav");
  if(!show){nav.replaceChildren();return;}
  const tabs=S.admin?[...TABS,["admin","관리"]]:TABS;
  nav.replaceChildren(...tabs.map(([k,l])=>h("button",{"data-tab":k,"aria-current":String(S.tab===k),onclick:()=>go(k)},l)));
  updateBadges();
}
function clearCur(){for(const c of S.cur.channels)sb.removeChannel(c);S.cur={channels:[]};}
function go(tab,view){
  clearCur();S.tab=tab;S.view=view||{name:"list"};
  renderNav(true);renderView();window.scrollTo(0,0);
}
function renderView(){
  const main=$("#main");main.replaceChildren();
  const v=S.view;
  if(S.tab==="board"){if(v.name==="write")viewWrite(main);else if(v.name==="post")viewPost(main,v.id);else viewBoard(main);}
  else if(S.tab==="chat"){if(v.name==="room")viewRoom(main,v.code);else viewChatList(main);}
  else if(S.tab==="admin"&&S.admin)viewAdmin(main);
  else if(S.tab==="settings")viewSettings(main);
  else viewFriends(main);
  fillNames();
}

function viewLogin(){
  renderNav(false);
  // 빠른 시작: 닉네임만
  const qNick=h("input",{type:"text",placeholder:"닉네임 (최대 20자)",maxlength:"20"});
  const qBtn=h("button",{class:"btn primary"},"바로 시작하기");
  const quick=async()=>{
    const n=qNick.value.trim();if(!n){toast("닉네임을 입력해 주세요");qNick.focus();return;}
    qBtn.disabled=true;
    try{const r=await sb.auth.signInAnonymously({options:{data:{name:n.slice(0,20)}}});if(r.error)throw r.error;}
    catch(err){
      if(/Anonymous sign-ins are disabled/i.test(err.message||""))toast("Supabase에서 익명 로그인(Allow anonymous sign-ins)을 켜 주세요.");
      else handleErr(err);
    }
    qBtn.disabled=false;
  };
  qBtn.addEventListener("click",quick);
  qNick.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.isComposing)quick();});

  // 아이디 계정 (내부적으로는 아이디@dajeongchat.app 형태로 저장)
  let mode="login";
  const email=h("input",{type:"text",placeholder:"아이디 (영문 소문자, 숫자, _ 4~20자)",autocomplete:"username",autocapitalize:"none",autocorrect:"off",spellcheck:"false",maxlength:"40"});
  const toLoginEmail=v=>v.includes("@")?v:v.toLowerCase()+"@dajeongchat.app";
  const pw=h("input",{type:"password",placeholder:"비밀번호 (6자 이상)",autocomplete:"current-password"});
  const nick=h("input",{type:"text",placeholder:"닉네임 (최대 20자)",maxlength:"20"});
  const btn=h("button",{class:"btn primary"},"로그인");
  const tLogin=h("button",{"aria-pressed":"true"},"로그인");
  const tSign=h("button",{"aria-pressed":"false"},"가입하기");
  const setMode=m=>{mode=m;tLogin.setAttribute("aria-pressed",String(m==="login"));tSign.setAttribute("aria-pressed",String(m==="signup"));
    nick.style.display=m==="signup"?"":"none";btn.textContent=m==="signup"?"가입하고 시작하기":"로그인";
    pw.setAttribute("autocomplete",m==="signup"?"new-password":"current-password");};
  tLogin.addEventListener("click",()=>setMode("login"));
  tSign.addEventListener("click",()=>setMode("signup"));
  const submit=async()=>{
    const id=email.value.trim(),p=pw.value,n=nick.value.trim();
    if(!id||!p){toast("아이디와 비밀번호를 입력해 주세요");return;}
    if(mode==="signup"&&!/^[a-z0-9_]{4,20}$/.test(id)){toast("아이디는 영문 소문자, 숫자, _로 4~20자여야 해요");email.focus();return;}
    if(p.length<6){toast("비밀번호는 6자 이상이어야 해요");return;}
    const e=toLoginEmail(id);
    if(mode==="signup"&&!n){toast("닉네임을 입력해 주세요");nick.focus();return;}
    btn.disabled=true;
    try{
      if(mode==="signup"){
        const r=await sb.auth.signUp({email:e,password:p,options:{data:{name:n.slice(0,20)}}});
        if(r.error){
          if(/already registered|already exists/i.test(r.error.message||"")){toast("이미 있는 아이디예요. 다른 아이디를 써 주세요.");btn.disabled=false;return;}
          throw r.error;
        }
        if(!r.data.session)toast("가입은 됐는데 자동 로그인이 안 됐어요. Supabase에서 Confirm email이 꺼져 있는지 확인해 주세요.");
      }else{
        const r=await sb.auth.signInWithPassword({email:e,password:p});
        if(r.error){
          if(/Invalid login credentials/i.test(r.error.message||"")){toast("아이디 또는 비밀번호가 맞지 않아요.");btn.disabled=false;return;}
          throw r.error;
        }
      }
    }catch(err){handleErr(err);}
    btn.disabled=false;
  };
  btn.addEventListener("click",submit);
  for(const i of [email,pw,nick])i.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.isComposing)submit();});
  setMode("login");
  const emailBox=h("div",{class:"stack",style:"display:none;margin-top:6px"},h("div",{class:"tabs"},tLogin,tSign),email,pw,nick,btn,
    h("p",{class:"hint"},"아이디 계정은 다른 기기나 홈 화면 앱에서도 같은 계정으로 들어올 수 있어요. 예전에 이메일로 가입했다면 아이디 칸에 이메일을 그대로 넣으면 돼요. 비밀번호는 찾기 기능이 없으니 꼭 기억해 두세요."));
  const toggle=h("button",{class:"link",style:"align-self:center;margin-top:8px"},"아이디로 로그인 / 가입하기");
  toggle.addEventListener("click",()=>{const open=emailBox.style.display==="none";emailBox.style.display=open?"":"none";toggle.textContent=open?"접기":"아이디로 로그인 / 가입하기";});

  $("#main").replaceChildren(h("div",{class:"welcome"},
    h("p",{class:"logo"},"다정챗"),
    h("p",{},"친구들과 글을 나누고 이야기하는 작은 방"),
    h("div",{class:"stack"},qNick,qBtn,
      h("p",{class:"hint"},"가입 없이 닉네임만으로 시작해요. 이 기기의 이 브라우저에 계정이 저장되니, 방문 기록을 지우면 다시 들어올 수 없어요."),
      toggle,emailBox)));
  qNick.focus();
}

/* ---------- 게시판 ---------- */
async function loadPosts(){
  try{
    let res=await sb.from("posts").select("id,title,author,created_at,images,likes(count),comments(count)").order("created_at",{ascending:false}).limit(200);
    if(res.error){console.warn(res.error);res=await sb.from("posts").select("id,title,author,created_at,images").order("created_at",{ascending:false}).limit(200);}
    const data=must(res);
    for(const p of data){p.likeN=(p.likes&&p.likes[0]&&p.likes[0].count)||0;p.cmtN=(p.comments&&p.comments[0]&&p.comments[0].count)||0;}
    S.posts=data;S.postsLoaded=true;
    if(S.seenPosts){for(const p of data){if(!S.seenPosts.has(p.id)&&p.author!==S.uid){beep();toast("새 글: "+p.title);sysNotify("다정챗 새 글",p.title);break;}}}
    S.seenPosts=new Set(data.map(p=>p.id));
    updatePostList();
  }catch(e){console.warn(e);}
}
function boardSort(){try{return localStorage.getItem("boardSort")||"new";}catch(e){return "new";}}
function viewBoard(main){
  const sorts=h("div",{class:"sorts",role:"group","aria-label":"정렬"});
  const drawSorts=()=>{
    const cur=boardSort();
    sorts.replaceChildren(...[["new","최신순"],["likes","추천순"],["comments","댓글순"]].map(([k,l])=>
      h("button",{"aria-pressed":String(cur===k),onclick:()=>{try{localStorage.setItem("boardSort",k);}catch(e){}drawSorts();updatePostList();}},l)));
  };
  drawSorts();
  main.append(h("div",{class:"head"},h("h1",{text:"게시판"}),h("button",{class:"btn primary",onclick:()=>go("board",{name:"write"})},"글쓰기")),
    sorts,h("ul",{class:"posts",id:"postlist"}));
  updatePostList();
}
function updatePostList(){
  const ul=$("#postlist");if(!ul)return;ul.replaceChildren();
  if(!S.postsLoaded){ul.append(h("li",{class:"empty"},"불러오는 중…"));return;}
  if(!S.posts.length){ul.append(h("li",{class:"empty"},"아직 글이 없어요. 첫 글을 써 보세요."));return;}
  const mode=boardSort();
  const list=[...S.posts];
  const t=p=>ms(p.created_at);
  if(mode==="likes")list.sort((a,b)=>(b.likeN||0)-(a.likeN||0)||t(b)-t(a));
  else if(mode==="comments")list.sort((a,b)=>(b.cmtN||0)-(a.cmtN||0)||t(b)-t(a));
  for(const p of list){
    ul.append(h("li",{},h("button",{class:"post-row",onclick:()=>go("board",{name:"post",id:p.id})},
      h("span",{class:"pt"},(p.images&&p.images.length?"📷 ":"")+p.title,p.cmtN?h("span",{class:"cnt"}," ["+p.cmtN+"]"):null),
      h("span",{class:"pm"},nameSpan(p.author),h("span",{},fmt(p.created_at)),h("span",{},"추천 "+(p.likeN||0)),h("span",{},"댓글 "+(p.cmtN||0))))));
  }
  fillNames();
}
function viewWrite(main){
  const title=h("input",{type:"text",placeholder:"제목",maxlength:"100"});
  const body=h("textarea",{placeholder:"내용을 입력하세요",maxlength:"5000"});
  const btn=h("button",{class:"btn primary"},"등록");
  const images=[];let uploading=0;
  const thumbs=h("div",{class:"thumbs"});
  const addBtn=h("button",{class:"btn"},"사진 추가");
  const drawThumbs=()=>{
    thumbs.replaceChildren(...images.map((u,i)=>h("div",{class:"thumb"},h("img",{src:u,alt:""}),
      h("button",{"aria-label":"사진 빼기",onclick:()=>{images.splice(i,1);drawThumbs();}},"×"))));
    addBtn.textContent=uploading?"올리는 중…":"사진 추가 ("+images.length+"/4)";
    addBtn.disabled=!!uploading||images.length>=4;
  };
  addBtn.addEventListener("click",async()=>{
    const files=(await pickFiles(true)).slice(0,4-images.length);if(!files.length)return;
    uploading+=files.length;drawThumbs();
    for(const f of files){try{images.push(await uploadPhoto(f));}catch(e){handleErr(e);}uploading--;drawThumbs();}
  });
  drawThumbs();
  btn.addEventListener("click",async()=>{
    const t=title.value.trim(),b=body.value.trim();
    if(!t){toast("제목을 입력해 주세요");title.focus();return;}
    if(uploading){toast("사진을 올리는 중이에요. 잠시만 기다려 주세요.");return;}
    btn.disabled=true;
    try{const row=must(await sb.from("posts").insert(images.length?{title:t.slice(0,100),body:b.slice(0,5000),images:images.slice(0,4)}:{title:t.slice(0,100),body:b.slice(0,5000)}).select("id").single());
      toast("글을 등록했어요");loadPosts();go("board",{name:"post",id:row.id});}
    catch(e){handleErr(e);btn.disabled=false;}
  });
  main.append(h("div",{class:"head"},h("h1",{text:"글쓰기"})),
    h("div",{class:"write"},title,body,thumbs,h("div",{class:"row",style:"justify-content:space-between"},addBtn,h("div",{class:"row"},h("button",{class:"btn",onclick:()=>go("board")},"취소"),btn))));
  title.focus();
}
function viewPost(main,id){
  const art=h("article",{class:"post"},h("p",{class:"empty"},"불러오는 중…"));
  const cList=h("ul");const cCount=h("h2",{},"댓글");
  const cInput=h("textarea",{rows:"2",placeholder:"댓글을 입력하세요",maxlength:"1000"});
  const cBtn=h("button",{class:"btn primary"},"등록");
  const cEmoBtn=h("button",{class:"attach",title:"이모티콘","aria-label":"이모티콘 댓글"},"😊");
  const cEmoPanel=h("div",{class:"emo-panel c-emo",style:"display:none"});
  const cEmo=makeEmoPanel(cEmoPanel,async e=>{
    try{must(await sb.from("comments").insert({post_id:id,text:"(이모티콘)",sticker_url:e.image_url}));cEmoPanel.style.display="none";loadComments();}
    catch(err){handleErr(err);}
  });
  cEmoBtn.addEventListener("click",()=>{const open=cEmoPanel.style.display==="none";cEmoPanel.style.display=open?"":"none";if(open)cEmo.open();});
  main.append(h("button",{class:"link",style:"margin-bottom:10px",onclick:()=>go("board")},"목록으로"),art,
    h("section",{class:"comments"},cCount,cList,h("div",{class:"c-tools"},cEmoBtn,cInput,cBtn),cEmoPanel));

  let post,likes=[];
  const draw=()=>{
    if(post===undefined)return;
    if(!post){art.replaceChildren(h("p",{class:"empty"},"삭제되었거나 없는 글이에요."));return;}
    const liked=likes.includes(S.uid);
    const likeBtn=h("button",{class:"btn like","aria-pressed":String(liked)},"추천 "+likes.length);
    likeBtn.addEventListener("click",async()=>{likeBtn.disabled=true;
      try{if(liked)must(await sb.from("likes").delete().eq("post_id",id).eq("user_id",S.uid));else must(await sb.from("likes").insert({post_id:id}));await loadLikes();}
      catch(e){handleErr(e);}likeBtn.disabled=false;});
    const del=(post.author===S.uid||S.admin)?twoStep(h("button",{class:"btn danger"},"삭제"),"삭제","한 번 더 누르면 삭제",async()=>{
      try{must(await sb.from("posts").delete().eq("id",id));toast("글을 삭제했어요");loadPosts();go("board");}catch(e){handleErr(e);}}):null;
    art.replaceChildren(h("h1",{},post.title),h("div",{class:"pm"},nameSpan(post.author),h("span",{},fmt(post.created_at))),
      h("div",{class:"body"},post.body||""),
      post.images&&post.images.length?h("div",{class:"imgs"},post.images.map(u=>photoLink(u))):null,
      h("div",{class:"post-actions"},likeBtn,del));
    fillNames();
  };
  const loadPost=async()=>{try{const {data}=await sb.from("posts").select("*").eq("id",id).maybeSingle();post=data||null;draw();}catch(e){console.warn(e);}};
  const loadLikes=async()=>{try{const {data}=await sb.from("likes").select("user_id").eq("post_id",id);likes=(data||[]).map(r=>r.user_id);draw();}catch(e){console.warn(e);}};
  const loadComments=async()=>{
    try{
      const cs=must(await sb.from("comments").select("*").eq("post_id",id).order("created_at",{ascending:true}).limit(500));
      cCount.textContent="댓글 "+cs.length;
      cList.replaceChildren(...cs.map(c=>h("li",{},
        h("div",{class:"c-meta"},nameSpan(c.author),h("span",{},fmt(c.created_at)),
          (c.author===S.uid||S.admin)?h("button",{class:"link",onclick:async()=>{try{must(await sb.from("comments").delete().eq("id",c.id));loadComments();}catch(e){handleErr(e);}}},"삭제"):null),
        c.sticker_url?h("img",{class:"c-sticker",src:c.sticker_url,alt:"이모티콘",loading:"lazy"}):h("div",{class:"c-text"},c.text))));
      fillNames();
    }catch(e){console.warn(e);}
  };
  cBtn.addEventListener("click",async()=>{
    const t=cInput.value.trim();if(!t)return;cBtn.disabled=true;
    try{must(await sb.from("comments").insert({post_id:id,text:t.slice(0,1000)}));cInput.value="";loadComments();}
    catch(e){handleErr(e);}cBtn.disabled=false;
  });
  loadPost();loadLikes();loadComments();
  const rc=debounce(loadComments),rl=debounce(loadLikes),rp=debounce(loadPost);
  const ch=sb.channel("post-"+id+"-"+Date.now())
    .on("postgres_changes",{event:"*",schema:"public",table:"comments"},p=>{if(p.eventType==="DELETE"||(p.new&&p.new.post_id===id))rc();})
    .on("postgres_changes",{event:"*",schema:"public",table:"likes"},p=>{if((p.new&&p.new.post_id===id)||(p.old&&p.old.post_id===id)||p.eventType==="DELETE")rl();})
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"posts"},()=>rp())
    .subscribe();
  S.cur.channels.push(ch);
}

/* ---------- 채팅 ---------- */
async function loadRooms(){
  try{
    const mine=must(await sb.from("room_members").select("room_id").eq("user_id",S.uid)).map(r=>r.room_id);
    const rows=mine.length?must(await sb.from("rooms").select("*").in("id",mine)):[];
    const dmIds=rows.filter(r=>r.is_dm).map(r=>r.id);
    if(dmIds.length){
      const mem=must(await sb.from("room_members").select("room_id,user_id").in("room_id",dmIds).neq("user_id",S.uid));
      for(const m of mem)S.dmOther[m.room_id]=m.user_id;
      for(const id of dmIds){if(!S.dmOther[id]){const parts=id.split("_");S.dmOther[id]=parts[1]===S.uid?parts[2]:parts[1];}}
    }
    const next={};
    for(const r of rows){
      next[r.id]=r;
      const prev=S.rooms[r.id];
      const changed=r.last_at&&(!prev||ms(prev.last_at)!==ms(r.last_at));
      if(!S.roomsFirst&&changed&&r.last_by!==S.uid){
        if(viewingRoom(r.id))markRead(r.id);
        else if(isMuted(r.id)){}
        else if(!prev){}
        else{
          S.rooms[r.id]=r;
          await fillNamesFor([S.dmOther[r.id]].filter(Boolean));
          beep();const t=roomTitle(r.id),b=(r.last_text||"").length>40?r.last_text.slice(0,40)+"…":(r.last_text||"");
          toast(t+": "+b);sysNotify(t,b);
        }
      }
    }
    if(!S.roomsFirst){
      for(const r of rows){const prev=S.rooms[r.id];if(prev&&r.notice&&r.notice!==prev.notice&&r.owner!==S.uid&&!isMuted(r.id))toast("📢 "+(r.name||"채팅방")+" 새 공지: "+r.notice.slice(0,40));}

  }catch(e){console.warn(e);if(!S.roomErrShown){S.roomErrShown=true;toast("채팅방 목록을 불러오지 못했어요. 잠시 후 다시 열어 주세요.");}}

function viewRoom(main,code){

    catch(err){handleErr(err);}

  });

  list.addEventListener("click",e=>{if(!e.target.closest(".bubble")&&!e.target.closest(".acts")&&S.cur.sel!=null){S.cur.sel=null;renderMsgs();}});
  updateRoomHead();

  const loadMsgs=async()=>{
    try{
      const rows=must(await sb.from("messages").select("*").eq("room_id",code).order("created_at",{ascending:false}).limit(200));
      S.cur.msgs=rows.reverse();renderMsgs();
      if(!document.hidden){markRead(code);updateBadges();}
    }catch(e){console.warn(e);list.replaceChildren(h("p",{class:"empty"},"이 방의 대화를 볼 수 없어요."));}
  };
  const loadCount=async()=>{
    try{
      const rows=must(await sb.from("room_members").select("user_id,joined_at").eq("room_id",code).order("joined_at",{ascending:true}));
      S.cur.members=rows.map(r=>r.user_id);S.cur.memberCount=rows.length;updateRoomHead();
      if($("#roommembers")&&$("#roommembers").style.display!=="none")drawMembers();
    }catch(e){}
  };
  loadMsgs();loadCount();
  const ch=sb.channel("room-"+code+"-"+Date.now())
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+code},p=>{
      addMsgs([p.new]);if(!document.hidden){markRead(code);updateBadges();}})
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},debounce(loadMsgs))
    .on("postgres_changes",{event:"*",schema:"public",table:"room_members",filter:"room_id=eq."+code},debounce(loadCount))
    .subscribe();
  S.cur.channels.push(ch);
  input.focus();
}

function renderMsgs(){
  const box=$("#msgs");if(!box)return;
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80||!box.dataset.init;
  const stick=atBottom;const prevTop=box.scrollTop;
  box.replaceChildren();
  const list=S.cur.msgs||[];
  if(!list.length)box.append(h("p",{class:"empty"},"첫 메시지를 보내 보세요."));
  let prevDay="",prevBy="";
  for(const m of list){
    const day=new Date(m.created_at).toDateString();
    if(day!==prevDay){box.append(h("div",{class:"day"},dayLabel(m.created_at)));prevDay=day;prevBy="";}
    const me=m.author===S.uid;
    if(!me&&m.author!==prevBy)box.append(h("div",{class:"who"},isOwnerOf(S.view.code,m.author)?h("span",{class:"crown",title:"방장"},"👑"):null,nameSpan(m.author)));
    const onImg=()=>{if(stick)box.scrollTop=box.scrollHeight;};
    const sel=S.cur.sel===m.id;
    const bubble=m.sticker_url
      ?h("div",{class:"bubble sticker"+(sel?" sel":"")},h("img",{src:m.sticker_url,alt:"이모티콘",loading:"lazy",onload:onImg}))
      :m.image_url
      ?h("div",{class:"bubble photo"+(sel?" sel":"")},h("img",{src:m.image_url,alt:"사진",loading:"lazy",onload:onImg}),m.text?h("div",{class:"cap"},m.text):null)
      :h("div",{class:"bubble"+(sel?" sel":"")},m.text);
    bubble.addEventListener("click",()=>{S.cur.sel=sel?null:m.id;renderMsgs();});
    box.append(h("div",{class:"line"+(me?" me":"")},bubble,h("span",{class:"tm"},hmOnly(m.created_at))));
    if(sel){
      const acts=[];
      if(m.image_url)acts.push(h("button",{onclick:()=>window.open(m.image_url,"_blank","noopener")},"크게 보기"));
      if(!m.sticker_url&&m.text)acts.push(h("button",{onclick:()=>{copyText(m.text);S.cur.sel=null;renderMsgs();}},"복사"));
      if(m.image_url)acts.push(h("button",{onclick:()=>{copyText(m.image_url);S.cur.sel=null;renderMsgs();}},"사진 링크 복사"));
      if(me||S.admin||isOwnerOf(S.view.code,S.uid))acts.push(twoStep(h("button",{class:"danger"},"삭제"),"삭제","한 번 더 누르면 삭제",async()=>{
        try{must(await sb.from("messages").delete().eq("id",m.id));S.cur.msgs=S.cur.msgs.filter(x=>x.id!==m.id);S.cur.sel=null;renderMsgs();}catch(e){handleErr(e);}
      }));
      if(acts.length)box.append(h("div",{class:"acts"+(me?" me":"")},acts));
    }
    prevBy=m.author;
  }
  if(atBottom)box.scrollTop=box.scrollHeight;else box.scrollTop=prevTop;
  box.dataset.init="1";
  fillNames();
}

/* ---------- 친구 ---------- */
async function loadFriends(){
  try{
    const rows=must(await sb.from("friends").select("user_id,friend_id"));
    S.friends=rows.filter(r=>r.user_id===S.uid).map(r=>r.friend_id);
    const inc=rows.filter(r=>r.friend_id===S.uid).map(r=>r.user_id);
    if(S.seenIncoming){const fresh=inc.find(i=>!S.seenIncoming.has(i)&&!S.friends.includes(i));if(fresh){beep();toast("새 친구 요청이 왔어요");sysNotify("다정챗","새 친구 요청이 왔어요");}}
    S.seenIncoming=new Set(inc);S.incoming=inc;
    updateFriends();updateBadges();
  }catch(e){console.warn(e);}
}
async function addFriend(fid){
  if(fid===S.uid){toast("내 코드예요. 친구의 코드를 입력해 주세요.");return;}
  if(S.friends.includes(fid)){toast("이미 친구예요");return;}
  try{must(await sb.from("friends").insert({friend_id:fid}));toast("친구로 추가했어요");await loadFriends();}
  catch(e){handleErr(e);}
}
async function addFriendByCode(raw){
  const c=raw.trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(c)){toast("친구 코드는 영문과 숫자 6자리예요");return;}
  try{const {data}=await sb.from("profiles").select("id,name").eq("code",c).maybeSingle();
    if(!data){toast("그 코드의 사용자를 찾지 못했어요");return;}
    S.names[data.id]=data.name;await addFriend(data.id);}
  catch(e){handleErr(e);}
}
async function openDM(fid){
  try{const c=must(await sb.rpc("open_dm",{p_friend:fid}));await loadRooms();go("chat",{name:"room",code:c});}

    h("div",{class:"panel"},h("h2",{},"앱 안 알림"),
      h("div",{class:"setrow"},h("span",{},"알림음"),soundBtn),
      h("h2",{style:"margin:12px 0 4px"},"알림 끈 채팅방"),mutedRooms),
    h("div",{class:"panel"},h("h2",{},"도움말"),
      h("p",{class:"hint",style:"margin:0 0 10px"},"다정챗 사용법을 처음부터 다시 볼 수 있어요."),
      h("button",{class:"btn",onclick:showGuide},"사용법 다시 보기")),
    h("div",{class:"panel"},h("h2",{},"앱 업데이트"),
      h("p",{class:"hint",style:"margin:0 0 10px"},"GitHub에 새 버전을 올렸는데 화면이 그대로면 눌러 주세요. 앱 전체를 새로 받아와요."),
      h("button",{class:"btn",onclick:async()=>{
        try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update();}catch(e){}
        location.replace(location.pathname+"?v="+Date.now());
      }},"앱 새로 불러오기")),
    h("div",{class:"panel"},h("h2",{},"내 정보"),h("div",{class:"row"},nick,nickBtn),
      h("div",{class:"row",style:"margin-top:10px;flex-wrap:wrap"},out)));
}
function updateFriends(){
  const rq=$("#reqs");
  if(rq)rq.replaceChildren(...pendingRequests().map(uid=>h("div",{class:"panel"},h("ul",{class:"friends"},h("li",{},
    h("span",{class:"av","data-initial":uid},"·"),
    h("span",{class:"fn"},nameSpan(uid)," 님이 나를 친구로 추가했어요"),
    h("button",{class:"btn primary",onclick:()=>addFriend(uid)},"나도 추가"),
    h("button",{class:"btn",onclick:()=>dismissRequest(uid)},"닫기"))))));
  const fl=$("#flist");if(!fl){fillNames();return;}
  $("#fcount").textContent="친구 "+S.friends.length;
  if(!S.friends.length){fl.replaceChildren(h("li",{class:"empty"},"아직 친구가 없어요. 친구 코드를 받아 추가해 보세요."));fillNames();return;}
  fl.replaceChildren(...S.friends.map(fid=>h("li",{},
    h("span",{class:"av","data-initial":fid},"·"),h("span",{class:"fn"},nameSpan(fid)),
    h("button",{class:"btn",onclick:()=>openDM(fid)},"1:1 채팅"),
    twoStep(h("button",{class:"link"},"삭제"),"삭제","한 번 더",async()=>{
      try{must(await sb.from("friends").delete().eq("user_id",S.uid).eq("friend_id",fid));loadFriends();}catch(e){handleErr(e);}}))));
  fillNames();
}

/* ---------- 시작 ---------- */
async function startApp(){
  S.posts=[];S.postsLoaded=false;S.seenPosts=null;S.rooms={};S.dmOther={};S.roomsLoaded=false;S.roomsFirst=true;
  S.friends=[];S.incoming=[];S.seenIncoming=null;
  S.mutes=new Set();
  go("board");
  loadPosts();loadRooms();loadFriends();loadMutes();
  subscribeGlobal();
}
function subscribeGlobal(){
  if(S.gch)sb.removeChannel(S.gch);
  const rp=debounce(loadPosts),rr=debounce(loadRooms,300),rf=debounce(loadFriends);
  S.gch=sb.channel("global-"+S.uid+"-"+Date.now())
    .on("postgres_changes",{event:"*",schema:"public",table:"posts"},rp)
    .on("postgres_changes",{event:"*",schema:"public",table:"rooms"},rr)
    .on("postgres_changes",{event:"*",schema:"public",table:"room_members",filter:"user_id=eq."+S.uid},rr)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},rr)
    .on("postgres_changes",{event:"*",schema:"public",table:"friends"},rf)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},p=>{
      const n=p.new;if(!n||!n.id)return;
      if(n.name)S.names[n.id]=n.name;if("admin_badge" in n)S.badge[n.id]=!!n.admin_badge;
      paintNames();
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"likes"},rp)
    .on("postgres_changes",{event:"*",schema:"public",table:"comments"},rp)
    .subscribe();
}
async function onSession(session){
  if(!session){
    if(S.gch){sb.removeChannel(S.gch);S.gch=null;}
    clearCur();S.uid=null;S.me=null;S.started=false;viewLogin();return;
  }
  if(S.started&&S.uid===session.user.id)return;
  S.uid=session.user.id;S.anon=!!session.user.is_anonymous;S.started=true;
  try{
    let p=null;
    for(let i=0;i<3&&!p;i++){const {data}=await sb.from("profiles").select("id,name,code").eq("id",S.uid).maybeSingle();p=data;if(!p)await new Promise(r=>setTimeout(r,600));}
    if(!p){toast("프로필을 찾지 못했어요. 데이터베이스 설정(setup.sql)을 실행했는지 확인해 주세요.");S.started=false;await sb.auth.signOut();return;}
    S.me={name:p.name,code:p.code};S.names[S.uid]=p.name;
    S.isAdmin=false;try{const {data}=await sb.rpc("is_admin");S.isAdmin=data===true;}catch(e){}
    S.admin=S.isAdmin&&adminModeOn();
    if(S.isAdmin)syncAdminBadge();
    startApp();
    if(!guideSeen())setTimeout(showGuide,600);
    syncPush();
    const q=new URLSearchParams(location.search).get("room");
    if(q){try{history.replaceState(null,"",location.pathname);}catch(e){}go("chat",{name:"room",code:q});}
  }catch(e){handleErr(e);S.started=false;viewLogin();}
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw",e));
  navigator.serviceWorker.addEventListener("message",ev=>{const d=ev.data;if(d&&d.type==="open-room"&&S.started&&d.room)go("chat",{name:"room",code:d.room});});
}
sb.auth.onAuthStateChange((event,session)=>{setTimeout(()=>onSession(session),0);});
</script>
